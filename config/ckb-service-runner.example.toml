# ckb-service-runner — example configuration (draft, subject to change)
# This file is separate from your node's ckb.toml. Nothing here changes the node.
#
# Not configurable by design: the full-node / sync check (R2).

[node]
rpc = "http://127.0.0.1:8114"   # must be localhost; remote hosts are refused
network = "testnet"             # "testnet" | "mainnet"

[ranking]
join = true                     # on by default; required to be assigned jobs later

[dashboard]
listen = "127.0.0.1:8080"

# ---------------------------------------------------------------------------
# Phase 2 — present but inactive until activation criteria are met
# ---------------------------------------------------------------------------
[runtime]
enabled = false
payout_address = ""             # one lock; multisig or JoyID possible. Never a wallet key.
service_key = "service_key.pem" # signs results only
allowed_services = []           # code hashes you approved; empty = run nothing
min_fee_shannons = 0

[runtime.limits]
max_cycles_per_request = 70_000_000
max_concurrent = 2
cpu_threads = 1
nice = 19                       # lowest OS priority: the node always wins

[runtime.storage]
path = "service_data"           # outside the node's data dir
total_quota_mb = 256
encrypt_at_rest = true

[payout]
lock_args = ""                  # anyone-can-pay args of your payout cell (0x + 40 hex), see csr.example.toml
