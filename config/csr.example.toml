# CSR example configuration (testnet). All keys are optional; unknown keys are errors.
network = "testnet"                 # testnet | mainnet

[node]
rpc_url = "http://127.0.0.1:8114"   # host must be 127.0.0.1, localhost or [::1]; http only
node_type = "auto"                  # auto | ckb | neuron

[dashboard]
bind = "127.0.0.1:8130"             # non-loopback bind requires password_hash (see `csr set-password`)
password_hash = ""

[ranking]
join = true
ping_mode = "inbound"               # inbound | outbound | both
ping_bind = "0.0.0.0:8131"

[monitor]
url = ""                            # empty = network default
pubkey = ""                         # empty = network default; 0x + 66 hex (compressed secp256k1)

# Several monitors instead of [monitor] (setting both is an error). Challenges signed by any of
# them are answered, the check-in goes to each, attestations are asked from the first.
# [[monitors]]
# url = "https://monitor.example"
# pubkey = "0x02..."

[runtime]
enabled = false
allowed_services = []               # code hashes: 0x + 64 hex characters each
min_ckb_per_mcycle = 0.0

[limits]
max_concurrent_jobs = 2             # 1..=64
max_cycles_per_job = 70000000
max_vm_memory_mb = 4                # fixed: only 4 is supported
max_job_wall_seconds = 30           # 1..=3600
pause_above_cpu_percent = 85        # 1..=100
min_free_ram_mb = 1024              # 0..=1048576
min_free_disk_gb = 10               # 0..=100000

[storage]
path = "service_data"
total_quota_mb = 256                # 1..=1000000
per_service_quota_mb = 64           # >= 1, <= total_quota_mb

[logging]
level = "info"                      # error | warn | info | debug | trace

[payout]
# Tips go into the runner wallet (the runner address, `csr wallet status`). When it holds at least
# sweep_threshold_ckb, the runner sends sweep_amount_ckb to sweep_address (your own wallet).
sweep_address = ""                  # "" = no sweep; a full-format address (ckb1…/ckt1…) of this network
sweep_threshold_ckb = 1500          # >= sweep_amount_ckb + 100, <= 2000000000
sweep_amount_ckb = 1000             # 61..=1000000000
