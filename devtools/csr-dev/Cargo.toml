[package]
name = "csr-dev"
version = "0.1.0"
edition = "2021"
description = "CSR developer CLI: deploy scripts, play the monitor, fund, sign (devnet / testnet only)"

[[bin]]
name = "csr-dev"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
secp256k1 = { version = "0.29", features = ["recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
ckb-types = "1"
ckb-jsonrpc-types = "1"
ckb-hash = "1"
sha2 = "0.10"
